<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <div style="font-size: 20px; font-weight: bold;">ShopAdmin Pro</div>
</div>

<div class="container" style="max-width: 600px;">
    <h2 style="color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 20px;">Cập nhật thông tin sản phẩm</h2>

    <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Tên sản phẩm <span style="color:red">*</span></label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm"/>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#e74c3c; font-size: 13px;"></span>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label>Giá bán (VNĐ) <span style="color:red">*</span></label>
                <input type="number" th:field="*{price}" class="form-control" step="1000"/>
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:#e74c3c; font-size: 13px;"></span>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Số lượng trong kho <span style="color:red">*</span></label>
                <input type="number" th:field="*{quantity}" class="form-control" />
                <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" style="color:#e74c3c; font-size: 13px;"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Danh mục <span style="color:red">*</span></label>
            <select th:field="*{category}" class="form-control">
                <option value="" disabled="disabled">-- Vui lòng chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color:#e74c3c; font-size: 13px;"></span>
        </div>

        <div class="form-group">
            <label>URL Hình ảnh</label>
            <input type="text" th:field="*{image_url}" class="form-control" placeholder="Ví dụ: https://link-anh.com/anh.jpg hoặc /images/anh.jpg"/>
        </div>

        <div class="form-group">
            <label>Mô tả chi tiết</label>
            <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập mô tả sản phẩm..."></textarea>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success" style="flex: 1; padding: 12px; font-size: 16px;">Lưu Dữ Liệu</button>
            <a th:href="@{/admin/products}" class="btn btn-danger" style="padding: 12px 25px; text-align: center; font-size: 16px;">Huỷ bỏ</a>
        </div>
    </form>
</div>
</body>
</html>
