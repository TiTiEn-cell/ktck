<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            background: #0f172a;
            color: white;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #020617;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            color: #38bdf8;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            margin: 10px 0;
        }

        .sidebar a:hover {
            color: white;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-btn {
            background: #22c55e;
            padding: 10px 15px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            position: relative;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        .admin {
            background: #ef4444;
        }

        .user {
            background: #3b82f6;
        }

        .actions {
            margin-top: 10px;
        }

        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit {
            background: #facc15;
        }

        .delete {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>MyShop</h2>
    <a href="#">Dashboard</a>
    <a href="#">Products</a>
    <a href="#">Logout</a>
</div>

<div class="main">
    <div class="header">
        <h1>Product List</h1>
        <button class="add-btn">+ Add Product</button>
    </div>

    <div class="grid">

        <!-- ADMIN PRODUCT -->
        <div class="card">
            <span class="badge admin">Admin</span>
            <h3>Laptop Gaming</h3>
            <p>Price: 20.000.000</p>
            <p>High performance laptop</p>

            <div class="actions">
                <button class="btn edit">Edit</button>
                <button class="btn delete">Delete</button>
            </div>
        </div>

        <!-- USER PRODUCT -->
        <div class="card">
            <span class="badge user">User</span>
            <h3>Mouse</h3>
            <p>Price: 200.000</p>
            <p>Wireless mouse</p>

            <div class="actions">
                <button class="btn edit">View</button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
