<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-box">
    <h2>Đăng Nhập</h2>
    <div th:if="${param.error}" style="color:#e74c3c; text-align:center; margin-bottom:15px; background:#fadbd8; padding:10px; border-radius:5px;">Sai tài khoản hoặc mật khẩu!</div>
    <div th:if="${param.logout}" style="color:#2ecc71; text-align:center; margin-bottom:15px; background:#d5f5e3; padding:10px; border-radius:5px;">Đã đăng xuất thành công!</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" name="username" class="form-control" placeholder="Nhập admin hoặc user" required/>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 16px;">Đăng nhập ngay</button>
    </form>
</div>
</body>
</html>
